<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pęknięte Szkło</title>
<style>
/* Układ: jeden pełnoekranowy canvas na czarnym tle, delikatna wskazówka na środku. */
:root {
  --void: #000000;
  --hint: #7b8791;
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--void);
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#glass {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--void);
  touch-action: none;
}

.hint {
  position: fixed;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  font: 500 12px/1 var(--font-ui);
  letter-spacing: 0.4em;
  padding-left: 0.4em;
  text-transform: uppercase;
  color: var(--hint);
  opacity: 0;
  transition: opacity 1.4s ease;
  pointer-events: none;
}

.hint.on { opacity: 0.6; }

.summary {
  position: fixed;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(calc(-100% - 34px));
  text-align: center;
  font: 500 12px/1.9 var(--font-ui);
  letter-spacing: 0.3em;
  padding: 0 20px 0 calc(20px + 0.3em);
  text-transform: uppercase;
  color: var(--hint);
  opacity: 0;
  transition: opacity 1.6s ease;
  pointer-events: none;
}

.summary.on { opacity: 0.8; }
.summary .main { font-size: 14px; letter-spacing: 0.16em; color: #aeb9c2; margin-bottom: 6px; white-space: nowrap; }
.summary .rec { color: #d3e9f7; }
.summary .sub { font-size: 10px; letter-spacing: 0.16em; opacity: 0.85; }

.sensor {
  position: fixed;
  left: 0;
  right: 0;
  bottom: max(18px, env(safe-area-inset-bottom));
  text-align: center;
  font: 500 11px/1.4 var(--font-ui);
  color: var(--hint);
  padding: 0 24px;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}

.sensor.on { opacity: 0.8; }

@media (prefers-reduced-motion: reduce) {
  .hint, .summary { transition: none; }
}
</style>
</head>
<body>
<canvas id="glass" role="img" aria-label="Czarne szkło. Dotknij albo przesuń palcem, aby je stłuc."></canvas>
<div id="hint" class="hint" aria-hidden="true">tap to start</div>
<div id="summary" class="summary" aria-live="polite"><div class="main" id="sumMain"></div><div class="sub" id="sumSub1"></div></div>
<div id="sensor" class="sensor" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- ustawienia (tu możesz kręcić) ---------- */
const CFG = {
  limit: 10,          // ile "obrażeń" wytrzymuje szkło, zanim się rozsypie
  tapDamage: 1,       // pojedyncze uderzenie
  trailDamage: 0.2,   // odcinek pęknięcia za palcem
  starDamage: 0.5,    // mały "wybuch" w trakcie przeciągania
  hitStop: 0.8,       // szansa, że nowe pęknięcie urwie się na istniejącym (reszta: przecina je)
  hitJoin: 0.3,       // szansa, że po dojściu do starego pęknięcia odgałęzi się dalej wzdłuż niego
  crushMin: 14,       // najmniejszy wgniot pod palcem (promień w px)
  crushMax: 42,       // największy wgniot pod palcem (promień w px)
  crushDensity: 0.9,  // gęstość wgniotu pod palcem: rys na każdy px promienia (więcej = gęstszy wgniot)
  slide: 4500,        // px/s^2: przyspieszenie zsuwania odłamków przy przechyle 90 stopni
  stick: 0.85,        // tarcie spoczynkowe (współczynnik): odłamek rusza, gdy tangens przechyłu > stick
  slideFric: 0.7,     // tarcie w ruchu (współczynnik, hamuje zsuwające się odłamki)
  finger: 40,         // promień palca w px przy popychaniu odłamków
  pushForce: 300,     // px/s: prędkość, jaką samo dotknięcie (bez przesuwania) nadaje trafionemu odłamkowi
  pushGain: 1.1,      // przy przesuwaniu: prędkość odłamka = prędkość palca razy tyle
  pushMax: 4000,      // px/s: górna granica prędkości odłamka od przesuwanego palca
  pushHop: 120,       // px/s: jak mocno palec podrzuca trafiony odłamek
  pushFric: 0.8,     // mnożnik tarcia w ruchu dla odłamka popchniętego palcem (mniej = dalej jedzie)
  bounce: 0.2,       // sprężystość zderzeń odłamków między sobą (0 = bez odbicia, 1 = pełne)
  shakeDead: 0.6,     // m/s^2: martwa strefa ruchu telefonu (szum czujnika poniżej tego jest ignorowany)
  tiltDead: 0.8,      // stopnie: drobniejsze zmiany pochylenia nie ruszają odłamków
  shake: 3.0,         // wzmocnienie reakcji na szarpnięcia, podrzuty i obroty telefonu
  hopGravity: 8600,   // px/s^2: jak szybko podskakujący odłamek opada z powrotem na ekran
  floorDelay: 0.45,   // s: po ilu sekundach odłamek, który wyjechał za ekran, uderza o podłogę
  floorVol: 1.3,      // głośność upadku odłamków na podłogę
  floorBounceSpeed: 200,   // px/s: co tyle prędkości wylotu dochodzi jedno odbicie od podłogi
  floorBounceMax: 15,       // najwięcej odbić od podłogi
  floorBounceDecay: 0.8,  // ile głośności zostaje przy każdym kolejnym odbiciu (0..1)
  floorGapSmall: 0.6,      // mnożnik odstępu między odbiciami dla najmniejszego okruchu (mniej = szybciej)
  floorGapLarge: 2.2,      // mnożnik odstępu między odbiciami dla największego kawałka (więcej = wolniej)
  floorHigh: 5200,         // Hz: ton upadku najmniejszego okruchu
  floorLow: 2500,           // Hz: ton upadku największego kawałka (większe = niższe)
  floorPitch: 0.9,  // wysokość dźwięku upadku względem brzęku na ekranie (mniej = niżej)
  floorTone: 2800,    // Hz: filtr dolnoprzepustowy upadku (mniej = głuchszy, bardziej "z daleka")
  shardLife: 40,     // po ilu sekundach leżące odłamki same znikają
  frameMin: 3,        // ile odłamków przy brzegu zostaje w ramce: losowo od frameMin do frameMax
  frameMax: 9,
  frameShake: 1.5,    // g: tak mocne szarpnięcie telefonem (po pierwszej sekundzie od rozbicia) odrywa wszystkie kawałki z ramki
  rustleVol: 0.3,     // głośność szelestu zsuwających się odłamków
  loudness: 1.2,      // wzmocnienie po kompresorze (głośność całości; limiter pilnuje, żeby nie przesterować)
  hintDelay: 3500,    // po ilu ms bez dotyku pokazać "dotknij"
  baseLight: 0.15,    // jasność linii bez odbicia (0..1), im mniej, tym ciemniej poza refleksami
  tiltGain: 1.7,      // ile razy wzmocnić pochylenie telefonu (większe = silniejsza reakcja)
  glint: 0.6,         // siła refleksów świetlnych na odłamkach (0 = wyłączone)
  glintRes: 0.5,      // rozdzielczość sprite'ów refleksów (0.3..1; mniej = lżej dla słabych telefonów)
  glintShine: 100,     // ostrość refleksu odłamka: więcej = węższy, krótszy błysk przy obrocie
  shine: 14           // ostrość odbić: im więcej, tym węższy refleks i szybsza reakcja na pochylenie
};

const cv = document.getElementById('glass');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');

const rnd = (a, b) => a + Math.random() * (b - a);
const nowS = () => performance.now() / 1000;

/* ---------- rozmiar i warstwa z utrwalonymi pęknięciami ---------- */
let W = 0, H = 0, DPR = 1;
let layer = null, lctx = null;

function resize() {
  const nw = window.innerWidth, nh = window.innerHeight;
  const nd = Math.min(window.devicePixelRatio || 1, 3);
  if (nw === W && nh === H && nd === DPR) return;
  if (shards) return;
  const old = layer, ow = W, oh = H;
  W = nw; H = nh; DPR = nd;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  layer = document.createElement('canvas');
  layer.width = cv.width;
  layer.height = cv.height;
  lctx = layer.getContext('2d');
  lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (old && ow) { lctx.drawImage(old, 0, 0, W, H); rescaleStore(W / ow, H / oh); }
  kick();
}

/* ---------- stan ---------- */
const impacts = [];   // pęknięcia w trakcie rośnięcia
let shards = null;    // odłamki po rozbiciu
let damage = 0;
let shatterAt = 0, shX = 0, shY = 0;
let flashT = 0;
let raf = 0, lastT = 0;
// kierunek światła (z góry) w układzie telefonu: x w prawo, y w górę ekranu, z do oczu
// domyślnie telefon trzymany ok. 55 stopni od poziomu (ekran zwrócony ku twarzy)
let lx = 0, ly = 0.819, lz = 0.574;
let ltx = lx, lty = ly, ltz = lz;   // wartość docelowa z czujnika, światło dąży do niej płynnie
function lightMoving() { return lx !== ltx || ly !== lty || lz !== ltz; }

function kick() { if (!raf) raf = requestAnimationFrame(frame); }

/* ---------- generowanie pęknięć ---------- */
// cieńsze linie niż wcześniej, żeby pęknięcie było bardziej jak na prawdziwym szkle
const CORE_W = [1.4, 0.9, 0.5];
const GLOW_W = [5.0, 3.0, 1.8];

function newOut() { return [[], [], []]; }

function pushSeg(out, s) {
  const k = s.w > 1.45 ? 0 : (s.w > 0.85 ? 1 : 2);
  out[k].push(s);
}

function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return Math.abs(d);
}

/* --- pamięć istniejących pęknięć: siatka do szybkich zapytań --- */
const CELL = 48;
const grid = new Map();
const storeSegs = [];
const tips = [];       // wolne końce pęknięć, które mogą rosnąć dalej
let newTips = [];

const gkey = (cx, cy) => (cx + 8) * 4096 + (cy + 8);

function gridAdd(s) {
  const x0 = Math.floor(Math.min(s.x1, s.x2) / CELL), x1 = Math.floor(Math.max(s.x1, s.x2) / CELL);
  const y0 = Math.floor(Math.min(s.y1, s.y2) / CELL), y1 = Math.floor(Math.max(s.y1, s.y2) / CELL);
  for (let cx = x0; cx <= x1; cx++) {
    for (let cy = y0; cy <= y1; cy++) {
      const k = gkey(cx, cy);
      let a = grid.get(k);
      if (!a) { a = []; grid.set(k, a); }
      a.push(s);
    }
  }
}

function clearStore() {
  grid.clear();
  storeSegs.length = 0;
  tips.length = 0;
  newTips = [];
}

function rescaleStore(sx, sy) {
  grid.clear();
  for (const s of storeSegs) {
    s.x1 *= sx; s.x2 *= sx; s.y1 *= sy; s.y2 *= sy;
    gridAdd(s);
  }
  for (const t of tips) { t.x *= sx; t.y *= sy; }
}

// pierwszy punkt przecięcia odcinka z istniejącymi pęknięciami
function findHit(x1, y1, x2, y2, ox, oy, minD) {
  const cx0 = Math.floor(Math.min(x1, x2) / CELL), cx1 = Math.floor(Math.max(x1, x2) / CELL);
  const cy0 = Math.floor(Math.min(y1, y2) / CELL), cy1 = Math.floor(Math.max(y1, y2) / CELL);
  const rx = x2 - x1, ry = y2 - y1;
  let best = null, bt = 2;
  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cy = cy0; cy <= cy1; cy++) {
      const a = grid.get(gkey(cx, cy));
      if (!a) continue;
      for (let i = 0; i < a.length; i++) {
        const s = a[i];
        const sx = s.x2 - s.x1, sy = s.y2 - s.y1;
        const den = rx * sy - ry * sx;
        if (den === 0) continue;
        const qx = s.x1 - x1, qy = s.y1 - y1;
        const t = (qx * sy - qy * sx) / den;
        const u = (qx * ry - qy * rx) / den;
        if (t <= 0.001 || t > 1 || u < 0 || u > 1 || t >= bt) continue;
        const hx = x1 + rx * t, hy = y1 + ry * t;
        if (Math.hypot(hx - ox, hy - oy) < minD) continue;
        bt = t;
        best = { x: hx, y: hy, seg: s };
      }
    }
  }
  return best;
}

// najbliższe istniejące pęknięcia wokół punktu, z różnych stron
function nearestCracks(x, y, R, maxN) {
  if (!maxN || !storeSegs.length) return [];
  const cx0 = Math.floor((x - R) / CELL), cx1 = Math.floor((x + R) / CELL);
  const cy0 = Math.floor((y - R) / CELL), cy1 = Math.floor((y + R) / CELL);
  const cand = [];
  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cy = cy0; cy <= cy1; cy++) {
      const a = grid.get(gkey(cx, cy));
      if (!a) continue;
      for (let i = 0; i < a.length; i++) {
        const s = a[i];
        const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
        const l2 = dx * dx + dy * dy || 1;
        let u = ((x - s.x1) * dx + (y - s.y1) * dy) / l2;
        u = Math.max(0, Math.min(1, u));
        const px = s.x1 + dx * u, py = s.y1 + dy * u;
        const d = Math.hypot(px - x, py - y);
        if (d < 10 || d > R) continue;
        cand.push({ d, x: px, y: py, ang: Math.atan2(py - y, px - x) });
      }
    }
  }
  cand.sort((a, b) => a.d - b.d);
  const picked = [];
  for (const c of cand) {
    if (picked.length >= maxN) break;
    if (picked.every((p) => angDiff(p.ang, c.ang) > 0.55)) picked.push(c);
  }
  return picked;
}

// nowe pęknięcie dochodzi do starego i rozgałęzia się dalej wzdłuż niego
function joinBranch(out, hit, a, t, speed, w, depth) {
  const s = hit.seg;
  const u = rnd(0.1, 0.9);
  const bx = s.x1 + (s.x2 - s.x1) * u, by = s.y1 + (s.y2 - s.y1) * u;
  const ca = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
  const along = angDiff(a, ca) < Math.PI / 2 ? ca : ca + Math.PI;
  const side = Math.random() < 0.5 ? -1 : 1;
  growPath(out, bx, by, along + side * rnd(0.3, 0.9), rnd(40, 130),
           t + 0.01, speed, Math.max(0.9, w), depth + 1, null);
}

function growPath(out, x, y, ang, len, t, speed, w0, depth, collect) {
  let d = 0, px = x, py = y, a = ang, ended = false;
  const pts = collect ? [{ x, y, d: 0, t }] : null;
  while (d < len) {
    const step = rnd(10, 26);
    a += rnd(-0.2, 0.2);
    const nx = px + Math.cos(a) * step;
    const ny = py + Math.sin(a) * step;
    const wt = Math.max(0.35, w0 * (1 - (d / len) * 0.75));

    const hit = findHit(px, py, nx, ny, x, y, 7);
    if (hit) {
      const r = Math.random();
      if (r < CFG.hitStop) {
        const l = Math.hypot(hit.x - px, hit.y - py);
        pushSeg(out, { x1: px, y1: py, x2: hit.x, y2: hit.y, t0: t, t1: t + l / speed, w: wt });
        t += l / speed;
        if (pts) pts.push({ x: hit.x, y: hit.y, d: d + l, t });
        if (r < CFG.hitJoin && depth < 2) joinBranch(out, hit, a, t, speed, wt, depth);
        ended = true;
        break;
      }
    }

    pushSeg(out, { x1: px, y1: py, x2: nx, y2: ny, t0: t, t1: t + step / speed, w: wt });
    d += step; t += step / speed; px = nx; py = ny;
    if (pts) pts.push({ x: px, y: py, d, t });
    if (depth < 2 && len - d > 40 && Math.random() < (depth === 0 ? 0.1 : 0.06)) {
      const side = Math.random() < 0.5 ? -1 : 1;
      growPath(out, px, py, a + side * rnd(0.35, 0.95), (len - d) * rnd(0.25, 0.55),
               t, speed * 0.9, wt * 0.7, depth + 1, null);
    }
    if (px < -60 || px > W + 60 || py < -60 || py > H + 60) { ended = true; break; }
  }
  if (!ended) newTips.push({ x: px, y: py, ang: a, w: Math.max(0.5, w0 * 0.3) });
  if (collect) collect.push(pts);
}

// promień celujący w konkretny punkt starego pęknięcia
function growToward(out, x, y, tx, ty, t, speed, w0, collect) {
  const L = Math.hypot(tx - x, ty - y) || 1;
  const ang = Math.atan2(ty - y, tx - x);
  const nxp = -Math.sin(ang), nyp = Math.cos(ang);
  const pts = [{ x, y, d: 0, t }];
  let d = 0, px = x, py = y;
  while (d < L - 0.5) {
    d = Math.min(L, d + rnd(10, 22));
    const f = d / L;
    const j = d >= L ? 0 : rnd(-1, 1) * 5 * (1 - f * 0.7);
    const nx = d >= L ? tx : x + (tx - x) * f + nxp * j;
    const ny = d >= L ? ty : y + (ty - y) * f + nyp * j;
    const l = Math.hypot(nx - px, ny - py) || 1;
    const wt = Math.max(0.45, w0 * (1 - f * 0.6));
    pushSeg(out, { x1: px, y1: py, x2: nx, y2: ny, t0: t, t1: t + l / speed, w: wt });
    t += l / speed; px = nx; py = ny;
    pts.push({ x: px, y: py, d, t });
  }
  collect.push(pts);
}

// stare końcówki w pobliżu uderzenia pękają dalej, lekko w jego stronę
function extendTips(x, y, T0, out, maxN) {
  if (!maxN) return;
  const R = Math.min(0.5 * Math.hypot(W, H), 320);
  let n = 0;
  for (let i = tips.length - 1; i >= 0 && n < maxN; i--) {
    const tp = tips[i];
    const d = Math.hypot(tp.x - x, tp.y - y);
    if (d > R || d < 12) continue;
    if (Math.random() > 0.8 * (1 - d / R) + 0.1) continue;
    const toward = Math.atan2(y - tp.y, x - tp.x);
    let diff = toward - tp.ang;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    const ang = tp.ang + diff * 0.3 + rnd(-0.15, 0.15);
    const len = rnd(40, 150) * (1 - 0.5 * d / R);
    tips.splice(i, 1);
    growPath(out, tp.x, tp.y, ang, len, T0 + d / 3000, rnd(2200, 3000),
             Math.max(0.9, tp.w * 1.5), 1, null);
    n++;
  }
}

function pointAtD(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].d >= d) {
      const a = pts[i - 1], b = pts[i];
      const f = (d - a.d) / ((b.d - a.d) || 1);
      return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, t: a.t + (b.t - a.t) * f };
    }
  }
  return null;
}

// odcinek pierścienia urywa się na istniejącym pęknięciu
function pushClipped(out, x1, y1, x2, y2, t0, dur, w) {
  const hit = findHit(x1, y1, x2, y2, x1, y1, 0);
  if (hit) {
    const f = Math.hypot(hit.x - x1, hit.y - y1) / (Math.hypot(x2 - x1, y2 - y1) || 1);
    pushSeg(out, { x1, y1, x2: hit.x, y2: hit.y, t0, t1: t0 + Math.max(0.005, dur * f), w });
    return true;
  }
  pushSeg(out, { x1, y1, x2, y2, t0, t1: t0 + dur, w });
  return false;
}

function register(out, x, y, flash) {
  // pęknięcia rosną kilka razy szybciej niż surowe czasy (pękają od razu po dotyku), z lekkim
  // losowym rozrzutem na każde uderzenie: skracamy czasy względem początku uderzenia
  let ts = Infinity;
  for (let k = 0; k < 3; k++) for (const s of out[k]) if (s.t0 < ts) ts = s.t0;
  if (ts < Infinity) {
    const ck = 2.5 * rnd(0.8, 1.25);
    for (let k = 0; k < 3; k++) {
      for (const s of out[k]) {
        s.t0 = ts + (s.t0 - ts) / ck;
        s.t1 = ts + (s.t1 - ts) / ck;
      }
    }
  }
  let tEnd = 0;
  for (let k = 0; k < 3; k++) {
    for (const s of out[k]) {
      if (s.t1 > tEnd) tEnd = s.t1;
      s.k = k;
      prepLight(s);
      gridAdd(s);
      storeSegs.push(s);
    }
  }
  for (const tp of newTips) tips.push(tp);
  newTips = [];
  if (tips.length > 400) tips.splice(0, tips.length - 400);
  impacts.push({ b: out, tEnd, x, y, f0: flash ? nowS() : -1 });
  kick();
}

function haze(x, y, r, a) {
  const g = lctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(200,235,255,' + a + ')');
  g.addColorStop(1, 'rgba(200,235,255,0)');
  lctx.globalCompositeOperation = 'lighter';
  lctx.fillStyle = g;
  lctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  lctx.globalCompositeOperation = 'source-over';
}

function spawnStar(x, y, o) {
  const out = newOut(), rays = [];
  const T0 = nowS();
  const diag = Math.hypot(W, H);
  const n = o.rays;
  const base = Math.random() * Math.PI * 2;
  const angs = [];
  for (let i = 0; i < n; i++) angs.push(base + i * (Math.PI * 2 / n) + rnd(-0.22, 0.22));

  // część promieni celuje w najbliższe istniejące pęknięcia i się z nimi łączy
  const linkFor = new Map();
  const targets = nearestCracks(x, y, Math.min(0.38 * diag, 300), o.links || 0)
    .filter((c, i) => i === 0 || Math.random() < (i === 1 ? 0.7 : 0.45));
  for (const c of targets) {
    let bi = -1, bd = 9;
    for (let i = 0; i < n; i++) {
      if (linkFor.has(i)) continue;
      const dd = angDiff(angs[i], c.ang);
      if (dd < bd) { bd = dd; bi = i; }
    }
    if (bi >= 0) linkFor.set(bi, c);
  }

  let maxLen = 0;
  for (let i = 0; i < n; i++) {
    const c = linkFor.get(i);
    if (c) {
      if (c.d > maxLen) maxLen = c.d;
      growToward(out, x, y, c.x, c.y, T0, rnd(2200, 3600), o.w, rays);
    } else {
      const len = diag * rnd(o.lenMin, o.lenMax);
      if (len > maxLen) maxLen = len;
      growPath(out, x, y, angs[i], len, T0, rnd(2200, 3600), o.w, 0, rays);
    }
  }

  // stare końcówki w okolicy dostają "impuls" i rosną dalej
  extendTips(x, y, T0, out, o.ext || 0);

  // pierścienie łączące sąsiednie promienie
  let r = rnd(o.ringStart[0], o.ringStart[1]);
  while (r < maxLen * 0.95) {
    const ps = rays.map((pts) => pointAtD(pts, r * rnd(0.94, 1.06)));
    for (let i = 0; i < n; i++) {
      const a = ps[i], b = ps[(i + 1) % n];
      if (!a || !b || Math.random() > 0.72) continue;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const dx = b.x - a.x, dy = b.y - a.y;
      const chord = Math.hypot(dx, dy) || 1;
      const off = rnd(-1, 1) * 0.08 * chord;
      const m = { x: mx - dy / chord * off, y: my + dx / chord * off };
      const t = Math.max(a.t, b.t) + 0.005;
      const w = o.w * 0.38;
      if (!pushClipped(out, a.x, a.y, m.x, m.y, t, 0.04, w)) {
        pushClipped(out, m.x, m.y, b.x, b.y, t + 0.04, 0.04, w);
      }
    }
    r *= rnd(1.5, 1.85);
  }

  // zmiażdżony punkt uderzenia: wgniot z wielu drobnych pęknięć wokół palca (promień o.crush):
  // krótkie, poszarpane rysy w różne strony (część rozwidlona) i maleńkie łuki między nimi
  const R = o.crush, nc = Math.round(R * CFG.crushDensity * rnd(0.4, 1.4));
  for (let k = 0; k < nc; k++) {
    const a = Math.random() * Math.PI * 2;
    const r0 = R * rnd(0, 0.35) * (k % 3 ? 1 : 0), l = R * rnd(0.45, 1.05) * (k % 5 ? 1 : 1.35);
    let px = x + Math.cos(a) * r0, py = y + Math.sin(a) * r0, aa = a;
    const w = rnd(0.9, 1.7);
    for (let s = 0; s < 2; s++) {
      aa += rnd(-0.45, 0.45);
      const sl = l * (s ? 0.45 : 0.55);
      const nx = px + Math.cos(aa) * sl, ny = py + Math.sin(aa) * sl;
      pushSeg(out, { x1: px, y1: py, x2: nx, y2: ny, t0: T0, t1: T0 + 0.03, w: w * (s ? 0.7 : 1) });
      if (s === 0 && Math.random() < 0.5) {
        const fa = aa + (Math.random() < 0.5 ? -1 : 1) * rnd(0.5, 1.0), fl = sl * rnd(0.5, 0.9);
        pushSeg(out, { x1: nx, y1: ny, x2: nx + Math.cos(fa) * fl, y2: ny + Math.sin(fa) * fl,
                       t0: T0 + 0.01, t1: T0 + 0.035, w: w * 0.6 });
      }
      px = nx; py = ny;
    }
  }
  // łuki na krawędzi opuszka (jak na prawdziwym szkle): 1-3 długie, poszarpane łuki wokół
  // wgniotu, czasem drugi, dalszy, plus krótkie poprzeczki wzdłuż łuku
  const arcs = [[1.0, rnd(0.9, 2.4)]];
  if (Math.random() < 0.7) arcs.push([1.0, rnd(0.5, 1.6)]);
  if (Math.random() < 0.55) arcs.push([rnd(1.35, 1.8), rnd(0.5, 1.4)]);
  for (const [f, span] of arcs) {
    const a0 = Math.random() * Math.PI * 2, base = R * f * rnd(0.9, 1.1);
    const steps = Math.max(3, Math.ceil(span * base / 7));
    const w = rnd(0.9, 1.4);
    let pa = a0, pr = base, px = x + Math.cos(pa) * pr, py = y + Math.sin(pa) * pr;
    for (let i = 1; i <= steps; i++) {
      const aa = a0 + span * i / steps, rr = base * rnd(0.94, 1.06);
      const nx = x + Math.cos(aa) * rr, ny = y + Math.sin(aa) * rr;
      const t0 = T0 + 0.01 + 0.04 * i / steps;
      pushSeg(out, { x1: px, y1: py, x2: nx, y2: ny, t0, t1: t0 + 0.01, w });
      if (i % 2 === 0 && Math.random() < 0.75) {
        const dl = rnd(3, 9) * (R / 30 + 0.4), dir = Math.random() < 0.6 ? 1 : -1;
        pushSeg(out, { x1: nx, y1: ny, x2: nx + Math.cos(aa) * dl * dir, y2: ny + Math.sin(aa) * dl * dir,
                       t0, t1: t0 + 0.01, w: w * 0.7 });
      }
      px = nx; py = ny;
    }
  }
  if (o.haze) haze(x, y, o.haze, 0.035);
  haze(x, y, R * 1.3, 0.07);   // jasny wgniot pod palcem
  register(out, x, y, o.flash);
}

function spawnTrail(x0, y0, x1, y1) {
  const out = newOut();
  const dx = x1 - x0, dy = y1 - y0;
  const L = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx);
  const speed = 3200;
  let px = x0, py = y0, d = 0, t = nowS();
  while (d < L) {
    const step = Math.min(rnd(8, 16), L - d);
    d += step;
    const nx = x0 + dx * (d / L) + rnd(-3.5, 3.5);
    const ny = y0 + dy * (d / L) + rnd(-3.5, 3.5);
    pushSeg(out, { x1: px, y1: py, x2: nx, y2: ny, t0: t, t1: t + step / speed, w: 1.5 });
    t += step / speed;
    if (Math.random() < 0.14) {
      growPath(out, nx, ny, ang + (Math.random() < 0.5 ? -1 : 1) * rnd(0.5, 1.2),
               rnd(30, 95), t, 2400, 1.0, 1, null);
    }
    px = nx; py = ny;
  }
  newTips.push({ x: px, y: py, ang, w: 1.0 });
  register(out, x1, y1, false);
}

/* ---------- światło: każdy odcinek pęknięcia łapie odbicie osobno ---------- */
// Odcinek pęknięcia to mała ścianka szkła. Jej normalna jest prostopadła do linii
// (w płaszczyźnie ekranu) i odchylona w głąb, a odchylenie zmienia się płynnie po ekranie,
// jak nachylenie płaskich odłamków. Światło pada z góry (świata), więc w układzie telefonu
// jego kierunek wynika z pochylenia. Jasność to odbicie lustrzane (normalna ścianki kontra
// wektor połówkowy H), a odcień zależy od strony odbicia (rozszczepienie barw).
const SEED = Math.random() * 1000;

function hash2(ix, iy) {
  const v = Math.sin(ix * 127.1 + iy * 311.7 + SEED) * 43758.5453;
  return v - Math.floor(v);
}

function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

// stałe cechy ścianki odcinka, liczone raz przy dodaniu pęknięcia
function prepLight(s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  const l = Math.hypot(dx, dy) || 1;
  const m = Math.max(-0.95, Math.min(0.95,
    (vnoise((s.x1 + s.x2) / 180, (s.y1 + s.y2) / 180) * 2 - 1) * 1.8));
  // prostopadła do linii, w układzie "y w górę"; m to odchylenie ścianki (ze znakiem)
  const nx = (-dy / l) * m + rnd(-0.12, 0.12);
  const ny = (-dx / l) * m + rnd(-0.12, 0.12);
  const nl = Math.hypot(nx, ny, 1);
  s.nx = nx / nl; s.ny = ny / nl; s.nz = 1 / nl;
}

const NB = 6, NH = 5;   // poziomy jasności i odcienie (pojemniki kolorów)
const HUE = [[120, 165, 235], [135, 205, 225], [205, 222, 238], [240, 215, 170], [235, 175, 160]]
  .map((c) => c.map((v) => Math.round(v * 0.55 + 150 * 0.45)));
const BINS = [0, 1, 2].map(() => Array.from({ length: NB * NH }, () => []));

function drawCracks(c, now) {
  const ll = Math.hypot(lx, ly, lz) || 1;
  let hx = lx / ll, hy = ly / ll, hz = lz / ll + 1;   // L + V, gdzie V = (0, 0, 1)
  const hl = Math.hypot(hx, hy, hz) || 1;
  hx /= hl; hy /= hl; hz /= hl;
  // ekran zwrócony od światła (telefon w dół) jest ogólnie ciemniejszy
  const mz = 0.55 + 0.45 * Math.max(0, Math.min(1, (lz / ll + 0.2) / 0.8));
  const base = CFG.baseLight, ks = CFG.shine;

  for (const row of BINS) for (const arr of row) arr.length = 0;
  for (let i = 0; i < storeSegs.length; i++) {
    const s = storeSegs[i];
    if (now <= s.t0) continue;
    const spec = Math.exp(-(1 - (s.nx * hx + s.ny * hy + s.nz * hz)) * ks);
    const I = (base + (1 - base) * spec) * mz;
    const bi = I >= 1 ? NB - 1 : Math.floor(I * NB);
    const h = 0.5 + (s.nx * hy - s.ny * hx) * 3.5;
    const hb = h <= 0 ? 0 : (h >= 1 ? NH - 1 : Math.floor(h * NH));
    BINS[s.k][hb * NB + bi].push(s);
  }

  c.lineCap = 'round';
  c.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++) {
    c.globalCompositeOperation = pass === 0 ? 'lighter' : 'source-over';
    for (let k = 0; k < 3; k++) {
      c.lineWidth = pass === 0 ? GLOW_W[k] : CORE_W[k];
      for (let hb = 0; hb < NH; hb++) {
        const col = HUE[hb];
        for (let bi = 0; bi < NB; bi++) {
          if (pass === 0 && bi < 2) continue;   // poświatę mają tylko jaśniejsze odcinki
          const arr = BINS[k][hb * NB + bi];
          if (!arr.length) continue;
          const ic = (bi + 0.5) / NB;
          const al = pass === 0 ? 0.07 * ic : 0.12 + 0.52 * ic;
          c.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + al.toFixed(3) + ')';
          c.beginPath();
          for (let j = 0; j < arr.length; j++) {
            const s = arr[j];
            const f = now >= s.t1 ? 1 : (now - s.t0) / (s.t1 - s.t0);
            c.moveTo(s.x1, s.y1);
            c.lineTo(s.x1 + (s.x2 - s.x1) * f, s.y1 + (s.y2 - s.y1) * f);
          }
          c.stroke();
        }
      }
    }
  }
  c.globalCompositeOperation = 'source-over';
}

function drawFlash(im, now) {
  if (im.f0 < 0) return;
  const age = now - im.f0;
  if (age < 0 || age > 0.3) return;
  const k = 1 - age / 0.3, a = k * k, r = 45 + age * 260;
  const g = ctx.createRadialGradient(im.x, im.y, 0, im.x, im.y, r);
  g.addColorStop(0, 'rgba(215,230,245,' + (0.4 * a) + ')');
  g.addColorStop(0.35, 'rgba(150,200,240,' + (0.12 * a) + ')');
  g.addColorStop(1, 'rgba(150,215,255,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(im.x - r, im.y - r, 2 * r, 2 * r);
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- czujnik pochylenia ---------- */
// Kierunek "w górę" świata w układzie telefonu (x w prawo, y w górę ekranu, z do oczu):
// u = (-sin(gamma) cos(beta), sin(beta), cos(gamma) cos(beta)). Światło pada z góry, więc L = u.
let gotTilt = false;
let physB = 55, physG = 0, physOk = false;
let tiltB = 55, tiltG = 0;   // surowe kąty z czujnika (dla zsuwania odłamków); bez czujnika: trzymany pod 55 stopni
function onTilt(e) {
  if (e.beta == null || e.gamma == null) return;
  if (!gotTilt) { gotTilt = true; sensorMsg(''); }
  tiltB = e.beta; tiltG = e.gamma;
  // do fizyki odłamków tylko zmiany większe niż drobny szum czujnika (histereza), żeby leżały spokojnie
  if (!physOk || Math.abs(e.beta - physB) > CFG.tiltDead || Math.abs(e.gamma - physG) > CFG.tiltDead) {
    physB = e.beta; physG = e.gamma; physOk = true;
  }
  // pochylenie liczone względem pozycji trzymania (55 stopni) i wzmocnione
  const bd = Math.max(-90, Math.min(180, 55 + (e.beta - 55) * CFG.tiltGain));
  const gd = Math.max(-80, Math.min(80, e.gamma * CFG.tiltGain));
  const b = bd * Math.PI / 180, g = gd * Math.PI / 180;
  ltx = -Math.sin(g) * Math.cos(b);
  lty = Math.sin(b);
  ltz = Math.cos(g) * Math.cos(b);
  if (Math.abs(ltx - lx) + Math.abs(lty - ly) + Math.abs(ltz - lz) > 0.003) kick();
}

// nasłuch podpinamy zawsze: na iOS zdarzenia ruszą dopiero po zgodzie, gdzie indziej od razu
window.addEventListener('deviceorientation', onTilt);

/* ---------- ruch telefonu (szarpnięcia, podrzuty, obroty) dla odłamków ---------- */
// Układ telefonu: x w prawo, y w górę ekranu, z do oczu. Przyspieszenia w m/s^2 (bez grawitacji),
// przyspieszenia kątowe w rad/s^2 liczone z różnicy kolejnych prędkości obrotu.
let mAx = 0, mAy = 0, mAz = 0, mAlx = 0, mAly = 0, mAlz = 0, mWz = 0, mT = -1;
let lastRR = null, lastRRt = 0;
// Przeglądarki podają ruch różnie: część dodaje grawitację albo stałe przesunięcie do
// "acceleration", a czujniki szumią. Dlatego odejmujemy wolno zmieniające się tło
// (średnia ok. 0,4 s), a drobny szum ucinamy martwą strefą. Szarpnięcia i podrzuty zostają.
let mBase = null, mBaseT = 0;
const deadZone = (v, z) => (Math.abs(v) <= z ? 0 : v - Math.sign(v) * z);
function onMotion(e) {
  const a = e.acceleration, t0 = e.timeStamp / 1000;
  if (a && a.x != null) {
    const v = [a.x, a.y || 0, a.z || 0];
    if (!mBase) { mBase = v.slice(); mBaseT = t0; }
    const k = 1 - Math.exp(-Math.max(0, t0 - mBaseT) / 0.4);
    mBaseT = t0;
    for (let i = 0; i < 3; i++) mBase[i] += (v[i] - mBase[i]) * k;
    mAx = deadZone(v[0] - mBase[0], CFG.shakeDead);
    mAy = deadZone(v[1] - mBase[1], CFG.shakeDead);
    mAz = deadZone(v[2] - mBase[2], CFG.shakeDead);
  }
  const r = e.rotationRate, t = e.timeStamp / 1000;
  if (r && r.alpha != null) {
    // beta: obrót wokół x, gamma: wokół y, alpha: wokół z (w stopniach na sekundę)
    const cur = [r.beta * Math.PI / 180, r.gamma * Math.PI / 180, r.alpha * Math.PI / 180];
    if (lastRR && t > lastRRt) {
      const d = Math.max(0.008, t - lastRRt);
      const cl = (v) => Math.max(-300, Math.min(300, v));
      mAlx = deadZone(cl((cur[0] - lastRR[0]) / d), CFG.shakeDead * 3);
      mAly = deadZone(cl((cur[1] - lastRR[1]) / d), CFG.shakeDead * 3);
      mAlz = deadZone(cl((cur[2] - lastRR[2]) / d), CFG.shakeDead * 3);
    }
    lastRR = cur; lastRRt = t;
    mWz = deadZone(cur[2], 0.15);
  }
  mT = nowS();
  if (shards) kick();
}
window.addEventListener('devicemotion', onMotion);

function sensorMsg(t) {
  const el = document.getElementById('sensor');
  if (!el) return;
  el.textContent = t;
  el.classList.toggle('on', !!t);
}

let sensorChecked = false;
function checkSensor() {
  if (sensorChecked) return;
  sensorChecked = true;
  setTimeout(() => {
    if (gotTilt) return;
    sensorMsg(window.isSecureContext
      ? 'brak danych z czujnika: zezwól na ruch i orientację'
      : 'pochylenie wymaga HTTPS (adres musi zaczynać się od https://)');
    setTimeout(() => sensorMsg(''), 7000);
  }, 1800);
}

let tiltAsked = false;
function initTilt() {
  checkSensor();
  if (tiltAsked) return;
  const D = window.DeviceOrientationEvent;
  // zgodę wolno zapytać tylko z gestu użytkownika (iOS); inne przeglądarki jej nie wymagają
  if (!D || typeof D.requestPermission !== 'function') return;
  tiltAsked = true;
  try {
    const p = D.requestPermission();
    if (p && p.catch) p.catch(() => { tiltAsked = false; });
  } catch (err) { tiltAsked = false; }
  // osobna zgoda na zdarzenia ruchu (podrzuty odłamków)
  const M = window.DeviceMotionEvent;
  if (M && typeof M.requestPermission === 'function') {
    try { const p = M.requestPermission(); if (p && p.catch) p.catch(() => {}); } catch (err) {}
  }
}

/* ---------- rozbicie: tafla pęka wzdłuż istniejących pęknięć ---------- */
// Pęknięcia są rysowane jako ściany na siatce (komórka G px), a obszary między nimi
// to odłamki (wypełnianie przez sąsiedztwo 4-kierunkowe, więc ukośne linie też zamykają).
// Drobiazgi są wchłaniane przez sąsiadów, a za duże obszary dzielone na kilka kawałków.
const MAX_SHARDS = 220;
const MS = 3;     // komórka maski odłamka (px)
const OB = 16;    // liczba punktów obrysu odłamka do wykrywania zderzeń
const PXM = 0.00016;   // ile metrów ma piksel CSS (do przeliczenia ruchu telefonu na ekran)

function shatter(cx, cy, now) {
  drawCracks(lctx, Infinity);
  impacts.length = 0;

  const G = W * H > 1.2e6 ? 2 : 1;
  const gw = Math.ceil(W / G), gh = Math.ceil(H / G), n = gw * gh;
  const lab = new Int32Array(n).fill(-1);
  const wall = new Uint8Array(n);
  for (const s of storeSegs) {
    if (s.w < 0.45) continue;   // najcieńsze końcówki nie dzielą szkła
    const st = Math.max(1, Math.ceil(Math.hypot(s.x2 - s.x1, s.y2 - s.y1) / (G * 0.5)));
    for (let i = 0; i <= st; i++) {
      const x = Math.floor((s.x1 + (s.x2 - s.x1) * i / st) / G);
      const y = Math.floor((s.y1 + (s.y2 - s.y1) * i / st) / G);
      if (x >= 0 && x < gw && y >= 0 && y < gh) wall[y * gw + x] = 1;
    }
  }

  // obszary między pęknięciami
  const q = new Int32Array(n);
  let area = [];
  let nl = 0;
  for (let i = 0; i < n; i++) {
    if (wall[i] || lab[i] >= 0) continue;
    let h = 0, t = 0;
    q[t++] = i; lab[i] = nl;
    while (h < t) {
      const c = q[h++], x = c % gw;
      if (x > 0 && !wall[c - 1] && lab[c - 1] < 0) { lab[c - 1] = nl; q[t++] = c - 1; }
      if (x < gw - 1 && !wall[c + 1] && lab[c + 1] < 0) { lab[c + 1] = nl; q[t++] = c + 1; }
      if (c >= gw && !wall[c - gw] && lab[c - gw] < 0) { lab[c - gw] = nl; q[t++] = c - gw; }
      if (c < n - gw && !wall[c + gw] && lab[c + gw] < 0) { lab[c + gw] = nl; q[t++] = c + gw; }
    }
    area.push(t);
    nl++;
  }

  // zostają największe obszary, drobne (i ściany) rozdzielamy między sąsiadów
  const minCells = 260 / (G * G);
  const order = area.map((a, i) => i).sort((a, b) => area[b] - area[a]);
  const remap = new Int32Array(nl).fill(-1);
  let K = 0;
  for (const l of order) {
    if (K >= MAX_SHARDS || (area[l] < minCells && K > 0)) break;
    remap[l] = K++;
  }
  let t = 0;
  for (let i = 0; i < n; i++) {
    lab[i] = lab[i] >= 0 ? remap[lab[i]] : -1;
    if (lab[i] >= 0) q[t++] = i;
  }
  if (!K) { lab.fill(0); K = 1; }
  for (let h = 0; h < t; h++) {
    const c = q[h], x = c % gw, l = lab[c];
    if (x > 0 && lab[c - 1] < 0) { lab[c - 1] = l; q[t++] = c - 1; }
    if (x < gw - 1 && lab[c + 1] < 0) { lab[c + 1] = l; q[t++] = c + 1; }
    if (c >= gw && lab[c - gw] < 0) { lab[c - gw] = l; q[t++] = c - gw; }
    if (c < n - gw && lab[c + gw] < 0) { lab[c + gw] = l; q[t++] = c + gw; }
  }

  // za duże obszary (tam, gdzie pęknięć było mało) dzielimy na kilka kawałków
  area = new Array(K).fill(0);
  for (let i = 0; i < n; i++) area[lab[i]]++;
  const maxCells = W * H / 26 / (G * G);
  const split = new Map();
  for (let l = 0; l < K; l++) {
    if (area[l] > maxCells) split.set(l, { k: Math.ceil(area[l] / maxCells), seeds: [], seen: 0 });
  }
  if (split.size) {
    // losowe ziarna z komórek obszaru (losowanie rezerwuarowe)
    for (let i = 0; i < n; i++) {
      const sp = split.get(lab[i]);
      if (!sp) continue;
      sp.seen++;
      if (sp.seeds.length < sp.k) sp.seeds.push(i);
      else if (Math.random() * sp.seen < sp.k) sp.seeds[Math.floor(Math.random() * sp.k)] = i;
    }
    for (const [l, sp] of split) {
      sp.lab = sp.seeds.map((c, j) => (j === 0 ? l : K++));
      sp.sx = sp.seeds.map((c) => c % gw);
      sp.sy = sp.seeds.map((c) => Math.floor(c / gw));
    }
    for (let i = 0; i < n; i++) {
      const sp = split.get(lab[i]);
      if (!sp) continue;
      const x = i % gw, y = Math.floor(i / gw);
      let bj = 0, bd = Infinity;
      for (let j = 0; j < sp.sx.length; j++) {
        const d = (x - sp.sx[j]) ** 2 + (y - sp.sy[j]) ** 2;
        if (d < bd) { bd = d; bj = j; }
      }
      lab[i] = sp.lab[bj];
    }
  }

  // ramki i środki odłamków
  const bx0 = new Int32Array(K).fill(gw), by0 = new Int32Array(K).fill(gh);
  const bx1 = new Int32Array(K).fill(-1), by1 = new Int32Array(K).fill(-1);
  const sumX = new Float64Array(K), sumY = new Float64Array(K), cnt = new Int32Array(K);
  for (let i = 0; i < n; i++) {
    const l = lab[i], x = i % gw, y = (i - x) / gw;
    if (x < bx0[l]) bx0[l] = x;
    if (x > bx1[l]) bx1[l] = x;
    if (y < by0[l]) by0[l] = y;
    if (y > by1[l]) by1[l] = y;
    sumX[l] += x; sumY[l] += y; cnt[l]++;
  }

  // maska (wnętrze odłamka) i krawędź (styk z innym odłamkiem), w rozdzielczości siatki
  const mk = document.createElement('canvas'), ek = document.createElement('canvas');
  mk.width = ek.width = gw + 2;
  mk.height = ek.height = gh + 2;
  const mctx = mk.getContext('2d'), ectx = ek.getContext('2d');
  const maxR = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy));

  shards = [];
  for (let l = 0; l < K; l++) {
    if (!cnt[l]) continue;
    const cw = bx1[l] - bx0[l] + 3, ch = by1[l] - by0[l] + 3;
    const x0 = (bx0[l] - 1) * G, y0 = (by0[l] - 1) * G, pw = cw * G, ph = ch * G;
    const ax = (sumX[l] / cnt[l] + 0.5) * G, ay = (sumY[l] / cnt[l] + 0.5) * G;
    const mi = mctx.createImageData(cw, ch), ei = ectx.createImageData(cw, ch);
    // zgrubna maska do zderzeń i trafień palcem (komórka MS px) oraz obrys: najdalszy
    // punkt krawędzi w każdym z OB kierunków od środka
    const mw = Math.ceil(pw / MS), mh = Math.ceil(ph / MS);
    const m = new Uint8Array(mw * mh);
    const ob = new Float64Array(OB * 3).fill(-1);
    for (let y = by0[l]; y <= by1[l]; y++) {
      for (let x = bx0[l]; x <= bx1[l]; x++) {
        const c = y * gw + x;
        if (lab[c] !== l) continue;
        const o = ((y - by0[l] + 1) * cw + (x - bx0[l] + 1)) * 4;
        mi.data[o + 3] = 255;
        m[Math.floor(((y + 0.5) * G - y0) / MS) * mw + Math.floor(((x + 0.5) * G - x0) / MS)] = 1;
        const inner = (x > 0 && lab[c - 1] !== l) || (x < gw - 1 && lab[c + 1] !== l) ||
                      (y > 0 && lab[c - gw] !== l) || (y < gh - 1 && lab[c + gw] !== l);
        if (inner) {
          ei.data[o] = 225; ei.data[o + 1] = 242; ei.data[o + 2] = 255; ei.data[o + 3] = 85;
        }
        if (inner || x === 0 || y === 0 || x === gw - 1 || y === gh - 1) {
          const ex = (x + 0.5) * G - ax, ey = (y + 0.5) * G - ay, d = ex * ex + ey * ey;
          const bi = Math.floor((Math.atan2(ey, ex) / (2 * Math.PI) + 0.5) * OB) % OB;
          if (d > ob[bi * 3]) { ob[bi * 3] = d; ob[bi * 3 + 1] = ex; ob[bi * 3 + 2] = ey; }
        }
      }
    }
    const ol = [];
    let ro = 4;
    for (let i = 0; i < OB; i++) {
      if (ob[i * 3] < 0) continue;
      const d = Math.sqrt(ob[i * 3]) || 1, f = Math.max(0, d - 3) / d;   // trochę do środka
      ol.push([ob[i * 3 + 1] * f, ob[i * 3 + 2] * f]);
      if (d > ro) ro = d;
    }
    mctx.clearRect(0, 0, mk.width, mk.height);
    ectx.clearRect(0, 0, ek.width, ek.height);
    mctx.putImageData(mi, 0, 0);
    ectx.putImageData(ei, 0, 0);

    const sc = document.createElement('canvas');
    sc.width = Math.max(1, Math.ceil(pw * DPR));
    sc.height = Math.max(1, Math.ceil(ph * DPR));
    const c = sc.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, -x0 * DPR, -y0 * DPR);
    c.fillStyle = 'rgba(160,215,255,' + rnd(0.04, 0.09) + ')';
    c.fillRect(x0, y0, pw, ph);
    // tylko potrzebny wycinek warstwy z pęknięciami
    const sx0 = Math.max(0, x0), sy0 = Math.max(0, y0);
    const sx1 = Math.min(W, x0 + pw), sy1 = Math.min(H, y0 + ph);
    if (sx1 > sx0 && sy1 > sy0) {
      c.drawImage(layer, sx0 * DPR, sy0 * DPR, (sx1 - sx0) * DPR, (sy1 - sy0) * DPR,
                  sx0, sy0, sx1 - sx0, sy1 - sy0);
    }
    c.imageSmoothingEnabled = true;
    c.globalCompositeOperation = 'destination-in';
    c.drawImage(mk, 0, 0, cw, ch, x0, y0, pw, ph);
    c.globalCompositeOperation = 'source-over';
    c.drawImage(ek, 0, 0, cw, ch, x0, y0, pw, ph);

    // sprite refleksu (w px CSS): wnętrze odłamka z jaśniejszym pasmem pod losowym kątem
    // (pasmo kolorowane losowym odcieniem, jak rozszczepienie światła) i obrys odłamka
    // niska rozdzielczość (glintRes): refleksy są miękkie, a sprite jest wtedy tańszy w rysowaniu
    // i pamięci; drobne okruchy w ogóle nie dostają refleksu
    const hw = Math.max(1, Math.round(pw * CFG.glintRes)), hh = Math.max(1, Math.round(ph * CFG.glintRes));
    const hl = Math.hypot(pw, ph) / 2 < 12 ? null : document.createElement("canvas");
    let hc = null;
    if (hl) { hl.width = hw; hl.height = hh; hc = hl.getContext("2d"); }
    if (hl) {
    hc.drawImage(mk, 0, 0, cw, ch, 0, 0, hw, hh);
    hc.globalCompositeOperation = "source-in";
    const ga = Math.random() * Math.PI, gdx = Math.cos(ga), gdy = Math.sin(ga);
    const glen = Math.abs(hw * gdx) + Math.abs(hh * gdy) || 1;
    const gg = hc.createLinearGradient(hw / 2 - gdx * glen / 2, hh / 2 - gdy * glen / 2,
                                       hw / 2 + gdx * glen / 2, hh / 2 + gdy * glen / 2);
    const hcol = HUE[Math.floor(Math.random() * NH)].map((v) => Math.min(255, v + 70));
    const rgb = (a) => "rgba(" + hcol[0] + "," + hcol[1] + "," + hcol[2] + "," + a + ")";
    const bc = rnd(0.25, 0.75), bw2 = rnd(0.08, 0.22), bc2 = Math.min(0.97, Math.max(0.03, bc + rnd(-0.4, 0.4)));
    const stops = [[0, 0.05], [Math.max(0, bc - bw2), 0.05], [bc, 0.95], [Math.min(1, bc + bw2), 0.05],
                   [Math.max(bc + bw2, bc2 - 0.04), 0.05], [bc2, 0.4], [Math.min(1, bc2 + 0.04), 0.05], [1, 0.05]];
    let last = 0;
    for (const [p, a] of stops) { const pp = Math.max(last, p); gg.addColorStop(pp, rgb(a)); last = pp; }
    hc.fillStyle = gg;
    hc.fillRect(0, 0, hw, hh);
    hc.globalCompositeOperation = "source-over";
    hc.globalAlpha = 0.9;
    hc.drawImage(ek, 0, 0, cw, ch, 0, 0, hw, hh);
    }
    // pochylenie ścianki odłamka (kąt do ekranu), od prawie płaskiej do wyraźnie skośnej
    const ta = Math.random() * Math.PI * 2, tm = rnd(0.12, 0.75);
    const dist = Math.hypot(ax - cx, ay - cy);
    let dx = ax - cx, dy = ay - cy;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    // odłamki podskakują (ku oczom) i rozjeżdżają się trochę od miejsca uderzenia
    const v0 = Math.min(280, (20 + 4500 / (dist + 60)) * rnd(0.5, 1.1));
    shards.push({
      cv: sc, bx: x0, by: y0, bw: pw, bh: ph, cx0: ax, cy0: ay,
      x: ax, y: ay, rot: 0, z: 0,
      vx: dx * v0 + rnd(-25, 25),
      vy: dy * v0 + rnd(-25, 25),
      vz: Math.min(700, (220 + 30000 / (dist + 100)) * rnd(0.6, 1.1)),
      w: rnd(-2.5, 2.5) * (1 + 60 / (dist + 60)),
      mu: rnd(0.7, 1.3),
      delay: now + 0.02 + (dist / maxR) * 0.12 + rnd(0, 0.04),
      r: Math.hypot(pw, ph) / 2,
      m, mw, mh, ol, ro,
      mass: cnt[l] * G * G,
      inertia: (cnt[l] * G * G) ** 2 / (2 * Math.PI),
      // przewrót w powietrzu: flip to kąt obrotu wokół osi w płaszczyźnie ekranu,
      // fs = 1 albo -1 (odłamek leży normalnie albo odwrócony)
      flip: 0, fw: Math.random() < 0.2 ? rnd(-9, 9) : 0, fs: 1,
      pushed: false,
      stuck: false, edge: bx0[l] <= 0 || by0[l] <= 0 || bx1[l] >= gw - 1 || by1[l] >= gh - 1,
      hl, tx: Math.cos(ta) * tm, ty: Math.sin(ta) * tm, tz: Math.sqrt(1 - tm * tm),
      dead: false
    });
  }
  // ostre odłamki przy brzegu zostają w ramce jak w prawdziwej szybie, dopóki ich ktoś nie ruszy
  const edge = shards.filter((s) => s.edge && s.mass > 600);
  for (let i = edge.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [edge[i], edge[j]] = [edge[j], edge[i]];
  }
  const nf = Math.min(edge.length, Math.floor(rnd(CFG.frameMin, CFG.frameMax + 1)));
  for (let i = 0; i < nf; i++) {
    const s = edge[i];
    s.stuck = true;
    s.vx = s.vy = s.w = s.vz = 0;
    s.fw = 0;
    s.mass0 = s.mass; s.inertia0 = s.inertia;
    s.mass = 1e9; s.inertia = 1e13;   // dla innych kawałków to nieruchoma przeszkoda
  }
  stats.pieces = shards.length;
  stats.bigShard = shards.reduce((m, s) => ((s.mass0 || s.mass) > (m.mass0 || m.mass) ? s : m), shards[0]);
  stats.big = (stats.bigShard.mass0 || stats.bigShard.mass) / (W * H);
  shards.t0 = now;
  flashT = now;
  shatterSound();
  vib([30, 40, 30, 40, 90]);
}

// grawitacja świata w układzie ekranu (x w prawo, y w dół), w jednostkach g:
// [składowa wzdłuż ekranu x, składowa wzdłuż ekranu y, nacisk na ekran (do tarcia)]
function slideAcc() {
  // bez czujnika (komputer) nie ma jak poznać pochylenia: odłamki leżą płasko i zostają na miejscu
  if (!gotTilt) return [0, 0, 1];
  const b = physB * Math.PI / 180, g = physG * Math.PI / 180;
  return [Math.sin(g) * Math.cos(b), Math.sin(b), Math.abs(Math.cos(g) * Math.cos(b))];
}

// kawałek w ramce odrywa się po dotknięciu, mocnym uderzeniu innego kawałka albo szarpnięciu telefonu
function releaseShard(s, quiet) {
  if (!s.stuck) return;
  s.stuck = false;
  s.mass = s.mass0; s.inertia = s.inertia0;
  s.delay = 0;
  if (!quiet) snapSound();
}

function drawShards(now, dt) {
  const [gx, gy, gn] = slideAcc();
  const A = CFG.slide, HG = CFG.hopGravity;
  const mv = now - mT < 0.15 ? CFG.shake : 0;   // tylko świeże dane o ruchu telefonu
  const wz2 = mWz * mWz;
  // pierwsza sekunda po rozbiciu pomijana: wibracja telefonu przy rozbiciu sama szarpie czujnikiem
  if (mv && now - shards.t0 > 1.2 && Math.hypot(mAx, mAy, mAz) / 9.81 > CFG.frameShake) {
    let any = false;
    for (const s of shards) if (s.stuck) { releaseShard(s, true); s.vz = rnd(80, 220); any = true; }
    if (any) snapSound();
  }
  for (const s of shards) {
    if (s.dead || now < s.delay || s.stuck) continue;
    // Telefon szarpnięty albo obrócony: odłamek z bezwładności "zostaje w miejscu", więc
    // w układzie ekranu czuje przyspieszenie przeciwne (plus odśrodkowe przy obrocie).
    // N to nacisk na ekran w jednostkach g; poniżej zera odłamek odrywa się od ekranu.
    let tx = gx, ty = gy, N = Math.max(0.35, gn);
    if (mv) {
      const rx = (s.x - W / 2) * PXM, ru = (H / 2 - s.y) * PXM;   // metry, y w górę
      const ax = -mAx + mAlz * ru + wz2 * rx;
      const au = -mAy - mAlz * rx + wz2 * ru;
      tx += ax / 9.81 * mv;
      ty -= au / 9.81 * mv;
      N += (mAz + mAlx * ru - mAly * rx) / 9.81 * mv;
    }
    s.vx += tx * A * dt;
    s.vy += ty * A * dt;
    if (s.z > 0 || s.vz > 0) {
      // w powietrzu: bez tarcia, może się przewracać
      s.vz -= N * HG * dt;
      s.z += s.vz * dt;
      s.flip += s.fw * dt;
      if (s.z <= 0) {
        // lądowanie na tafli: odbicie, utrata prędkości, obrót od uderzenia
        const hit = -s.vz;
        s.z = 0;
        s.vz = hit > 150 ? hit * 0.28 : 0;
        s.vx *= 0.7; s.vy *= 0.7;
        s.w = s.w * 0.6 + rnd(-1, 1) * Math.min(5, hit / 120);
        s.flip = Math.round(s.flip / Math.PI) * Math.PI;
        s.fs = Math.cos(s.flip) < 0 ? -1 : 1;
        s.fw = 0;
        if (hit > 250) clink(Math.min(1, hit / 900) * 0.5);
      }
    } else if (N < 0) {
      // podrzut: ekran odjeżdża spod odłamka, odłamek się odrywa, kręci i czasem przewraca
      s.vz = -N * HG * dt;
      s.z = 0.001;
      s.w += rnd(-1, 1) * Math.min(6, -N * 4);
      if (-N > 0.8 && Math.random() < 0.5) s.fw = rnd(5, 11) * (Math.random() < 0.5 ? -1 : 1);
      s.pushed = false;
    } else {
      // leży na ekranie: tarcie spoczynkowe trzyma, w ruchu hamuje (słabiej po popchnięciu palcem)
      const sp = Math.hypot(s.vx, s.vy);
      if (sp < 6 && Math.hypot(tx, ty) < CFG.stick * s.mu * N) {
        s.vx = 0; s.vy = 0; s.pushed = false;
      } else if (sp > 0) {
        const dv = CFG.slideFric * s.mu * N * (s.pushed ? CFG.pushFric : 1) * A * dt;
        if (dv >= sp) { s.vx = 0; s.vy = 0; s.pushed = false; } else { s.vx -= s.vx / sp * dv; s.vy -= s.vy / sp * dv; }
      }
      s.w *= Math.exp(-4 * dt);
    }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.rot += s.w * dt;
    if (s.x + s.r < -30 || s.x - s.r > W + 30 || s.y + s.r < -30 || s.y - s.r > H + 30) {
      s.dead = true;
      floorSound(s.mass, Math.hypot(s.vx, s.vy));
    }
  }

  // szelest: zsuwające się i przesuwane odłamki szeleszczą o taflę i o siebie jednostajnym szumem;
  // ton i głośność zależą od wielkości kawałków (duże: niżej i głośniej, drobne: wyżej i ciszej)
  let rs = 0, rf = 0;
  for (const s of shards) {
    if (s.dead || s.stuck || s.z > 3 || now < s.delay) continue;
    const sp = Math.hypot(s.vx, s.vy);
    if (sp < 25) continue;
    const size = Math.min(1, Math.sqrt(s.mass) / 120);
    const w = Math.min(sp, 700) / 700 * (0.25 + 0.75 * size);
    rs += w;
    rf += w * Math.log(RUSTLE_HIGH * Math.pow(RUSTLE_LOW / RUSTLE_HIGH, size));
  }
  rustleSet(rs > 0.02 ? Math.pow(1 - Math.exp(-rs * 0.3), 1.6) : 0, rs > 0 ? Math.exp(rf / rs) : 3000);

  collide(now);

  let alive = 0;
  const age = now - shards.t0;
  const fade = Math.max(0, Math.min(1, CFG.shardLife + 1 - age));
  ctx.globalAlpha = fade;
  // wektor połówkowy H = norm(L + V), V = (0,0,1) w układzie canvasa (y w dół)
  const ll = Math.hypot(lx, ly, lz) || 1;
  let hx = lx / ll, hy = -ly / ll, hz = lz / ll + 1;
  const hn = Math.hypot(hx, hy, hz) || 1;
  hx /= hn; hy /= hn; hz /= hn;
  // najpierw leżące, na wierzchu te w powietrzu (lekko powiększone, bo bliżej oczu);
  // refleksy każdej warstwy rysujemy hurtem po jej odłamkach (jedno przełączenie trybu mieszania)
  const glints = [];
  const DR = DPR;
  for (let pass = 0; pass < 2; pass++) {
    glints.length = 0;
    for (const s of shards) {
      if (s.dead || (s.z > 0) !== (pass === 1)) continue;
      alive++;
      const k = 1 + s.z / 700;
      const fl = s.z > 0 ? Math.cos(s.flip) : s.fs;
      const cr = Math.cos(s.rot), sr = Math.sin(s.rot);
      // macierz: przesunięcie (x, y) * obrót rot * skala (k * fl, k), razem ze skalą ekranu
      const m0 = cr * k * fl * DR, m1 = sr * k * fl * DR, m2 = -sr * k * DR, m3 = cr * k * DR;
      ctx.setTransform(m0, m1, m2, m3, s.x * DR, s.y * DR);
      ctx.drawImage(s.cv, s.bx - s.cx0, s.by - s.cy0, s.bw, s.bh);
      if (CFG.glint > 0 && s.hl) {
        // refleks: normalna ścianki obrócona przewrotem (wokół osi y odłamka, jak spłaszczenie
        // w powietrzu) i obrotem w płaszczyźnie ekranu, błysk gdy zbliży się do H
        const sn = s.z > 0 ? Math.sin(s.flip) : 0;
        let nx = s.tx * fl + s.tz * sn, ny = s.ty, nz = -s.tx * sn + s.tz * fl;
        if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }   // szkło odbija obiema stronami
        const rx = nx * cr - ny * sr, ry = nx * sr + ny * cr;
        const spec = Math.exp(-(1 - (rx * hx + ry * hy + nz * hz)) * CFG.glintShine);
        const al = (0.04 + 0.96 * spec) * CFG.glint * fade;
        if (al > 0.06) glints.push(s, al, m0, m1, m2, m3);
      }
    }
    if (glints.length) {
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < glints.length; i += 6) {
        const s = glints[i];
        ctx.globalAlpha = Math.min(1, glints[i + 1]);
        ctx.setTransform(glints[i + 2], glints[i + 3], glints[i + 4], glints[i + 5], s.x * DR, s.y * DR);
        ctx.drawImage(s.hl, s.bx - s.cx0, s.by - s.cy0, s.bw, s.bh);
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = fade;
    }
  }
  ctx.setTransform(DR, 0, 0, DR, 0, 0);
  ctx.globalAlpha = 1;
  if (!alive || age > CFG.shardLife + 1) endShatter();
}

// czy punkt ekranu leży na odłamku (zgrubna maska odłamka)
function shardAt(s, x, y) {
  const dx = x - s.x, dy = y - s.y;
  const k = 1 + s.z / 700;
  if (dx * dx + dy * dy > (s.ro * k + MS) ** 2) return false;
  const fl = s.z > 0 ? Math.cos(s.flip) : s.fs;
  if (Math.abs(fl) < 0.2) return false;
  const co = Math.cos(s.rot), si = Math.sin(s.rot);
  const mx = Math.floor(((dx * co + dy * si) / (k * fl) + s.cx0 - s.bx) / MS);
  const my = Math.floor(((-dx * si + dy * co) / k + s.cy0 - s.by) / MS);
  return mx >= 0 && my >= 0 && mx < s.mw && my < s.mh && s.m[my * s.mw + mx] === 1;
}

// kierunek na zewnątrz odłamka w punkcie (z maski), albo null
function outward(s, x, y) {
  const e = 5;
  const nx = shardAt(s, x - e, y) - shardAt(s, x + e, y);
  const ny = shardAt(s, x, y - e) - shardAt(s, x, y + e);
  const l = Math.hypot(nx, ny);
  return l ? [nx / l, ny / l] : null;
}

// Zderzenia leżących odłamków: punkty obrysu jednego wchodzące w drugi dają styk,
// w nim impuls z odbiciem (CFG.bounce) i tarciem, który popycha i obraca oba kawałki.
// Duże odłamki są ciężkie, więc małe głównie się od nich odbijają.
let lastClink = 0;
function collide(now) {
  const act = [];
  for (const s of shards) if (!s.dead && now >= s.delay && s.z < 3) act.push(s);
  for (let i = 0; i < act.length; i++) {
    const a = act[i];
    const aMove = a.vx * a.vx + a.vy * a.vy > 4 || Math.abs(a.w) > 0.05;
    for (let j = i + 1; j < act.length; j++) {
      const b = act[j];
      if (!aMove && !(b.vx * b.vx + b.vy * b.vy > 4 || Math.abs(b.w) > 0.05)) continue;
      const rr = a.ro + b.ro;
      if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 > rr * rr) continue;
      // punkty obrysu a w b i b w a
      let cx = 0, cy = 0, n = 0, own = null;
      for (const [s, o] of [[a, b], [b, a]]) {
        const co = Math.cos(s.rot), si = Math.sin(s.rot);
        for (const p of s.ol) {
          const px = p[0] * s.fs, py = p[1];
          const wx = s.x + px * co - py * si, wy = s.y + px * si + py * co;
          if (shardAt(o, wx, wy)) { cx += wx; cy += wy; n++; if (!own) own = s; }
        }
        if (n) break;
      }
      if (!n) continue;
      cx /= n; cy /= n;
      // normalna styku skierowana od b do a
      const other = own === a ? b : a;
      let nrm = outward(other, cx, cy);
      if (nrm && own === b) nrm = [-nrm[0], -nrm[1]];
      if (!nrm) {
        const dx = a.x - b.x, dy = a.y - b.y, l = Math.hypot(dx, dy) || 1;
        nrm = [dx / l, dy / l];
      }
      const [nx, ny] = nrm;
      const rax = cx - a.x, ray = cy - a.y, rbx = cx - b.x, rby = cy - b.y;
      const vrx = (a.vx - a.w * ray) - (b.vx - b.w * rby);
      const vry = (a.vy + a.w * rax) - (b.vy + b.w * rbx);
      const vn = vrx * nx + vry * ny;
      if (vn >= 0) continue;   // już się rozjeżdżają
      const raxn = rax * ny - ray * nx, rbxn = rbx * ny - rby * nx;
      const jn = -(1 + CFG.bounce) * vn /
        (1 / a.mass + 1 / b.mass + raxn * raxn / a.inertia + rbxn * rbxn / b.inertia);
      a.vx += jn * nx / a.mass; a.vy += jn * ny / a.mass; a.w += raxn * jn / a.inertia;
      b.vx -= jn * nx / b.mass; b.vy -= jn * ny / b.mass; b.w -= rbxn * jn / b.inertia;
      // tarcie w styku: szuranie o krawędź obraca odłamki
      let tx = vrx - vn * nx, ty = vry - vn * ny;
      const tl = Math.hypot(tx, ty);
      if (tl > 1e-3) {
        tx /= tl; ty /= tl;
        const raxt = rax * ty - ray * tx, rbxt = rbx * ty - rby * tx;
        let jt = -tl / (1 / a.mass + 1 / b.mass + raxt * raxt / a.inertia + rbxt * rbxt / b.inertia);
        jt = Math.max(-0.3 * jn, Math.min(0.3 * jn, jt));
        a.vx += jt * tx / a.mass; a.vy += jt * ty / a.mass; a.w += raxt * jt / a.inertia;
        b.vx -= jt * tx / b.mass; b.vy -= jt * ty / b.mass; b.w -= rbxt * jt / b.inertia;
      }
      // lekkie rozsunięcie, żeby kawałki nie wchodziły w siebie
      const sa = b.mass / (a.mass + b.mass);
      a.x += nx * 0.8 * sa; a.y += ny * 0.8 * sa;
      b.x -= nx * 0.8 * (1 - sa); b.y -= ny * 0.8 * (1 - sa);
      if (-vn > 120 && now - lastClink > 0.09) { lastClink = now; clink(Math.min(1, -vn / 600) * 0.35); }
    }
  }
}

// szelest szkła sunącego po szkle: jeden ciągły szum (zapętlony szum przez filtr pasmowy), którego
// głośność i środek pasma zmieniamy płynnie co klatkę; level 0 wycisza
const RUSTLE_HIGH = 7500, RUSTLE_LOW = 1800;   // Hz: środek pasma dla drobnego okruchu i dużego kawałka
let rustleNode = null;
function rustleSet(level, freq) {
  if (!AC || !noiseBuf) return;
  if (!rustleNode) {
    if (level <= 0) return;
    const src = AC.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = AC.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 0.7; f.frequency.value = freq;
    const g = AC.createGain();
    g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
    rustleNode = { f, g };
  }
  const t = AC.currentTime;
  rustleNode.g.gain.setTargetAtTime(level * 0.04 * CFG.rustleVol, t, 0.08);
  rustleNode.f.frequency.setTargetAtTime(freq, t, 0.08);
}

// trzask oderwania kawałka z ramki
function snapSound() {
  if (!AC) return;
  nb(0, 0.012, 'highpass', 2500, 0.8, 0.3, 0.001);
  ping(0.002, rnd(2600, 4200), rnd(0.08, 0.18), 0.08);
  crackle(3, 0.06, 0.5);
}

// cichy brzęk szkła o szkło
function clink(g) {
  if (!AC) return;
  ping(0, rnd(3000, 8000), rnd(0.04, 0.12), rnd(0.02, 0.05) * g * 2);
  nb(0, rnd(0.004, 0.008), 'highpass', rnd(4000, 8000), 1, 0.12 * g);
}

// Odłamek, który wyjechał za ekran, po CFG.floorDelay s spada na podłogę: uderzenie
// (głośniejsze niż brzęk na ekranie), czasem rozprysk na drobniejsze kawałki
// i kilka coraz krótszych, cichszych odbić. Duże kawałki brzmią niżej i głośniej.
const floorHits = [];
function floorSound(mass, speed) {
  if (!AC) return;
  const now = AC.currentTime;
  // gdy naraz spada dużo odłamków, część dźwięków pomijamy, żeby nie przesterować
  while (floorHits.length && floorHits[0] < now - 0.2) floorHits.shift();
  if (floorHits.length >= 8) return;
  // im więcej upadków naraz, tym ciszej każdy (suma nie przeciąża toru wyjścia)
  const crowd = 1 / Math.sqrt(1 + floorHits.length * 0.6);
  floorHits.push(now);
  outNode = getFloorBus();

  const size = Math.min(1, Math.sqrt(mass) / 120);   // 0 = okruch, 1 = duży kawałek
  const g = CFG.floorVol * crowd * (0.5 + 0.5 * size) * (0.85 + 0.15 * Math.min(1, speed / 1500));
  let t = CFG.floorDelay + rnd(0, 0.08);
  // wysokość tonu z wielkości kawałka (skala logarytmiczna: okruch floorHigh, duży floorLow),
  // z małym rozrzutem, żeby wielkość była wyraźnie słyszalna
  const base = CFG.floorHigh * Math.pow(CFG.floorLow / CFG.floorHigh, size) * rnd(0.93, 1.07) * CFG.floorPitch;
  // pierwsze uderzenie
  nb(t, rnd(0.008, 0.015), 'highpass', rnd(2500, 5000), 0.8, 0.3 * g);
  nb(t, 0.05, 'bandpass', rnd(600, 1200), 1.2, 0.12 * g * size);
  // głuche stuknięcie o podłogę
  nb(t, 0.07, 'lowpass', rnd(220, 380), 0.9, 0.35 * g * (0.4 + 0.6 * size), 0.002);
  [1, 1.53, 2.21, 2.97].forEach((m, i) => {
    ping(t + 0.002, base * m * rnd(0.97, 1.03), rnd(0.12, 0.3) / (1 + i * 0.4), 0.1 * g / (1 + i * 0.6));
  });
  // większy kawałek pęka przy upadku i rozsypuje się drobnymi okruchami
  if (Math.random() < 0.3 + 0.6 * size) {
    const n = 3 + Math.floor(size * 7);
    for (let i = 0; i < n; i++) {
      const tt = t + 0.01 + Math.pow(Math.random(), 1.4) * 0.3;
      ping(tt, rnd(3500, 9000) * CFG.floorPitch, rnd(0.03, 0.1), rnd(0.02, 0.05) * g);
      nb(tt, rnd(0.003, 0.007), 'highpass', rnd(4000, 8000), 1, rnd(0.06, 0.14) * g);
    }
  }
  // odbicia: im szybciej odłamek wyleciał, tym więcej odbić i dłuższy pierwszy skok;
  // każde kolejne krótsze i cichsze
  const bounces = Math.min(CFG.floorBounceMax,
    1 + Math.floor(speed / CFG.floorBounceSpeed + Math.random()));
  // odstęp między odbiciami zależy od wielkości: okruchy odbijają się szybko (floorGapSmall),
  // duże kawałki wolniej (floorGapLarge), pośrednie logarytmicznie pomiędzy
  const gapK = CFG.floorGapSmall * Math.pow(CFG.floorGapLarge / CFG.floorGapSmall, size);
  let gap = (rnd(0.08, 0.12) + Math.min(0.12, speed / 20000)) * gapK, gb = g * 0.5;
  for (let i = 0; i < bounces; i++) {
    t += gap;
    ping(t, base * rnd(0.98, 1.08), rnd(0.05, 0.14) * (1 + size), 0.08 * gb);
    nb(t, rnd(0.004, 0.009) * (1 + size), 'highpass', base * rnd(1.4, 2), 1, 0.22 * gb);
    gap *= rnd(0.55, 0.72);
    gb *= CFG.floorBounceDecay * rnd(0.85, 1.1);
  }
  outNode = null;
}

// tor dźwięku upadku: filtr dolnoprzepustowy (głuchszy, dalszy dźwięk)
// i krótkie echo pomieszczenia, żeby upadek brzmiał inaczej niż brzęk na ekranie
let floorBus = null;
function getFloorBus() {
  if (floorBus) return floorBus;
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = CFG.floorTone;
  lp.Q.value = 0.7;
  const dl = AC.createDelay(0.3), fb = AC.createGain(), wet = AC.createGain();
  dl.delayTime.value = 0.055;
  fb.gain.value = 0.3;
  wet.gain.value = 0.35;
  lp.connect(master);
  lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
  floorBus = lp;
  return floorBus;
}

// palec podrzuca i odpycha tylko odłamki, których faktycznie dotknie; pts to punkty pod palcem.
// Samo dotknięcie (fv nieokreślone) odpycha od palca z siłą pushForce. Przy przesuwaniu
// odłamek dostaje prędkość palca (fv, px/s) razy pushGain w kierunku ruchu (ux, uy),
// więc szybki ruch odrzuca go daleko, a powolny tylko przesuwa.
function pushShards(pts, fv, ux, uy) {
  const R = CFG.finger, now = nowS();
  const offs = [[0, 0, 1], [R, 0, 0.6], [-R, 0, 0.6], [0, R, 0.6], [0, -R, 0.6]];
  const drag = fv !== undefined;
  const target = drag ? Math.min(CFG.pushMax, fv * CFG.pushGain) : CFG.pushForce;
  const loud = drag ? Math.min(1, fv / 1500) : 1;
  let n = 0;
  for (const s of shards) {
    if (s.dead) continue;
    let k = 0, hx = 0, hy = 0;
    for (const p of pts) {
      for (const o of offs) {
        if (o[2] <= k || !shardAt(s, p[0] + o[0], p[1] + o[1])) continue;
        k = o[2]; hx = p[0]; hy = p[1];
      }
    }
    if (!k) continue;
    if (s.stuck) releaseShard(s);
    const dx = s.x - hx, dy = s.y - hy, d = Math.hypot(dx, dy) || 1;
    const rx = dx / d, ry = dy / d;
    if (drag) {
      // prędkość wzdłuż ruchu palca podciągnięta do prędkości palca
      // (nie sumuje się, gdy palec trzyma odłamek przez kilka ruchów)
      const v = target * k, along = s.vx * ux + s.vy * uy;
      if (along < v) { s.vx += (v - along) * ux; s.vy += (v - along) * uy; }
      s.vx += rx * v * 0.15; s.vy += ry * v * 0.15;
      s.vz = Math.max(s.vz, CFG.pushHop * k * Math.min(1, fv / 1000));
      s.w += rnd(-1, 1) * Math.min(6, v / 250);
    } else {
      s.vx += rx * target * k;
      s.vy += ry * target * k;
      s.vz = Math.max(s.vz, CFG.pushHop * k);
      s.w += rnd(-3, 3) * k;
    }
    s.pushed = true;
    if (s.delay > now) s.delay = now;
    if (now - (s.tp || 0) > 0.2) n++;   // dźwięk tylko dla świeżo trafionych
    s.tp = now;
  }
  if (n && AC && loud > 0.05) {
    for (let i = 0; i < Math.min(6, n); i++) ping(rnd(0, 0.12), rnd(2500, 8000), rnd(0.05, 0.16), rnd(0.02, 0.05) * loud);
    crackle(3, 0.08, 0.4 * loud);
  }
  kick();
}

/* ---------- podsumowanie po opróżnieniu planszy ---------- */
const summary = document.getElementById("summary");
const stats = { pieces: 0, big: 0, bigShard: null };
const BEST_KEY = "pekator-rekord", BEST_BIG_KEY = "pekator-rekord-kawalek";
function loadNum(k) { try { return parseFloat(localStorage.getItem(k)) || 0; } catch (e) { return 0; } }
function saveNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
const plural = (n, a, b, c) => (n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? b : c));
const fmt1 = (v) => v.toFixed(1).replace(".", ",");
let summaryTimer = 0;
let trophy = null;   // największy kawałek ostatniej szyby: kręci się w 3D nad podsumowaniem

function showSummary() {
  const best = loadNum(BEST_KEY), bestBig = loadNum(BEST_BIG_KEY);
  const isNew = stats.pieces > best, isNewBig = stats.big > bestBig + 1e-9;
  if (isNew) saveNum(BEST_KEY, stats.pieces);
  if (isNewBig) saveNum(BEST_BIG_KEY, stats.big);
  const main = document.getElementById("sumMain"), sub = document.getElementById("sumSub1");
  main.textContent = stats.pieces + " " + plural(stats.pieces, "kawałek", "kawałki", "kawałków") +
    "  ·  " + (isNew ? "nowy rekord" : "rekord " + best);
  sub.textContent = "największy " + fmt1(stats.big * 100) + "% szyby  ·  " +
    (isNewBig ? "nowy rekord" : "rekord " + fmt1(bestBig * 100) + "%");
  main.classList.toggle("rec", isNew);
  sub.classList.toggle("rec", isNewBig);
  const s = stats.bigShard, glow = isNewBig ? 2.2 : 1;
  clearTimeout(summaryTimer);
  summaryTimer = setTimeout(() => {   // najpierw chwila czystej czerni
    summary.classList.add("on");
    if (!s) return;
    // kawałek dopasowany do pudełka nad tekstem i ustawiony tuż nad nim
    const top = summary.getBoundingClientRect().top;
    const box = Math.max(50, Math.min(120, top - 60));
    const scale = Math.min(1, box / Math.max(s.bw, s.bh));
    const size = Math.max(s.bw, s.bh) * scale;
    trophy = { s, scale, size, cy: top - 26 - size / 2, glow, t0: nowS(), off: 0 };
    kick();
  }, 600);
}

// największy kawałek obraca się w 3D wokół osi pionowej (ściśnięcie w poziomie plus lekkie
// pochylenie jak w perspektywie), z poświatą za nim i refleksem przebiegającym po powierzchni
function drawTrophy(now) {
  const t = trophy;
  if (!t) return;
  let a = Math.min(1, (now - t.t0) / 1.6);
  if (t.off) {
    a *= Math.max(0, 1 - (now - t.off) / 0.4);
    if (a <= 0) { trophy = null; return; }
  }
  const s = t.s, sc = t.scale, cx = W / 2, cy = t.cy;
  const ang = (now - t.t0) * 1.1 + 0.6, c = Math.cos(ang), sn = Math.sin(ang);
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const r = t.size * 0.95;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, "rgba(170,215,255," + (0.16 * a * t.glow) + ")");
  g.addColorStop(1, "rgba(170,215,255,0)");
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = g;
  ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  ctx.globalCompositeOperation = "source-over";
  ctx.transform(1, 0, 0, 1, cx, cy);
  ctx.transform(c * sc, 0.12 * sn * sc, 0, sc, 0, 0);
  ctx.globalAlpha = a;
  ctx.drawImage(s.cv, s.bx - s.cx0, s.by - s.cy0, s.bw, s.bh);
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = a * 0.7;
  ctx.drawImage(s.cv, s.bx - s.cx0, s.by - s.cy0, s.bw, s.bh);
  if (s.hl) {
    ctx.globalAlpha = a * (0.15 + 0.85 * Math.pow(Math.abs(Math.sin(ang * 0.9 + 1)), 6));
    ctx.drawImage(s.hl, s.bx - s.cx0, s.by - s.cy0, s.bw, s.bh);
  }
  ctx.restore();
}

function endShatter() {
  showSummary();
  if (rustleNode) rustleSet(0, 3000);
  shards = null;
  lctx.clearRect(0, 0, W, H);
  impacts.length = 0;
  clearStore();
  damage = 0;
  shatterAt = 0;
  armHint();
}

/* ---------- pętla ---------- */
function frame() {
  raf = 0;
  const now = nowS();
  const dt = Math.min(0.05, lastT ? now - lastT : 0.016);
  lastT = now;

  if (shatterAt && now >= shatterAt) { shatterAt = 0; shatter(shX, shY, now); }

  // płynne dochodzenie światła do aktualnego pochylenia telefonu
  lx += (ltx - lx) * 0.3; ly += (lty - ly) * 0.3; lz += (ltz - lz) * 0.3;
  if (Math.abs(ltx - lx) + Math.abs(lty - ly) + Math.abs(ltz - lz) < 0.002) { lx = ltx; ly = lty; lz = ltz; }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (shards) {
    drawShards(now, dt);
  } else {
    ctx.drawImage(layer, 0, 0, W, H);
    drawCracks(ctx, now);
    for (let i = impacts.length - 1; i >= 0; i--) {
      const im = impacts[i];
      drawFlash(im, now);
      if (now > im.tEnd + 0.03 && (im.f0 < 0 || now - im.f0 > 0.3)) impacts.splice(i, 1);
    }
  }

  drawTrophy(now);

  const fa = flashT ? now - flashT : 1;
  if (fa >= 0 && fa < 0.18) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,255,255,' + (0.12 * (1 - fa / 0.18)) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  if (impacts.length || shards || shatterAt || fa < 0.2 || lightMoving() || trophy) kick(); else lastT = 0;
}

/* ---------- dźwięk (Web Audio, bez plików) ---------- */
let AC = null, master = null, noiseBuf = null, iosDone = false;
let outNode = null;   // gdzie podłączać nowe dźwięki (null = master); floorSound kieruje je przez floorBus

function unlockIOS() {
  if (iosDone) return;
  iosDone = true;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    const rate = 8000, n = 800;
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const wr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    wr(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); wr(8, 'WAVE'); wr(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    wr(36, 'data'); v.setUint32(40, n * 2, true);
    const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
    a.loop = true;
    a.setAttribute('playsinline', '');
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

function initAudio() {
  try {
    if (!AC) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      // tor wyjścia, żeby wiele dźwięków naraz nie przesterowało głośnika telefonu:
      // filtr górnoprzepustowy (głośnik i tak nie zagra basu, a bas go dławi) ->
      // kompresor (wyrównuje) -> wzmocnienie (przywraca głośność) -> limiter (szczyty) ->
      // miękkie obcięcie (ostatnia zapora zamiast twardego trzasku)
      const hp = AC.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 160; hp.Q.value = 0.7;
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4;
      comp.attack.value = 0.003; comp.release.value = 0.15;
      const makeup = AC.createGain();
      makeup.gain.value = CFG.loudness;
      const lim = AC.createDynamicsCompressor();
      lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20;
      lim.attack.value = 0.001; lim.release.value = 0.08;
      const clip = AC.createWaveShaper();
      const cn = 1024, curve = new Float32Array(cn);
      for (let i = 0; i < cn; i++) { const x = i / (cn - 1) * 2 - 1; curve[i] = Math.tanh(x * 1.3) / Math.tanh(1.3); }
      clip.curve = curve;
      master = AC.createGain();
      master.gain.value = 0.9;
      master.connect(hp); hp.connect(comp); comp.connect(makeup); makeup.connect(lim);
      lim.connect(clip); clip.connect(AC.destination);
      const len = AC.sampleRate * 2;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state !== 'running') {
      const p = AC.resume();
      if (p && p.catch) p.catch(() => {});
    }
    unlockIOS();
  } catch (e) {}
}

// Limit głosów: w każdym okienku 50 ms może wystartować najwyżej VOICE_SLOT dźwięków,
// a gdy okienko się zapełnia, najpierw odpadają ciche. Chroni przed zakrztuszeniem
// (przeciążenie wątku audio) i przesterowaniem, gdy naraz spada dużo odłamków.
const VOICE_SLOT = 16;
const voiceSlots = new Map();
const MAX_VOICES = 12;   // najwięcej głosów brzmiących w jednej chwili
let vlist = [];
function allowVoice(t0, gain, dur) {
  const now = AC.currentTime;
  if (vlist.length > 80) vlist = vlist.filter((v) => v.e > now);
  let active = 0;
  for (const v of vlist) if (v.s <= t0 && v.e >= t0) active++;
  if (active >= MAX_VOICES || (active >= MAX_VOICES * 0.6 && gain < 0.04)) return false;
  const slot = Math.floor(t0 * 20);
  const c = voiceSlots.get(slot) || 0;
  if (c >= VOICE_SLOT || (c >= VOICE_SLOT * 0.6 && gain < 0.04)) return false;
  voiceSlots.set(slot, c + 1);
  vlist.push({ s: t0, e: t0 + dur });
  if (voiceSlots.size > 200) {
    const old = Math.floor(AC.currentTime * 20) - 2;
    for (const k of voiceSlots.keys()) if (k < old) voiceSlots.delete(k);
  }
  return true;
}

function nb(t, dur, type, freq, q, gain, attack, endFreq) {
  if (!AC) return;
  attack = attack || 0.001;
  const t0 = AC.currentTime + t;
  if (!allowVoice(t0, gain, dur)) return;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const f = AC.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t0);
  if (endFreq) f.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
  f.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(outNode || master);
  src.start(t0, Math.random() * (noiseBuf.duration - dur - 0.1));
  src.stop(t0 + dur + 0.02);
}

function ping(t, freq, dur, gain, endFreq) {
  if (!AC) return;
  const t0 = AC.currentTime + t;
  if (!allowVoice(t0, gain, dur)) return;
  const o = AC.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(outNode || master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function crackle(n, span, scale) {
  for (let i = 0; i < n; i++) {
    const t = span * Math.pow(i / n, 0.7) + rnd(0, 0.02);
    nb(t, rnd(0.004, 0.012), 'bandpass', rnd(2500, 9000), rnd(1, 5),
       rnd(0.1, 0.35) * scale * (1 - (i / n) * 0.5));
  }
}

function hitSound(s) {
  if (!AC) return;
  nb(0, 0.08, 'lowpass', 650, 0.7, 0.5 * s);
  ping(0, rnd(105, 150), 0.14, 0.38 * s, 45);
  nb(0, 0.05, 'highpass', 2600, 0.7, 0.55 * s);
  nb(0.002, 0.2, 'bandpass', rnd(4200, 7200), 2.2, 0.16 * s);
  const base = rnd(1700, 2500);
  [1, 1.47, 2.09, 2.76].forEach((m, i) => {
    ping(0.004, base * m * rnd(0.98, 1.02), rnd(0.22, 0.55) / (1 + i * 0.4), 0.05 / (1 + i * 0.5));
  });
  crackle(9, 0.3, s);
}

let lastScratch = 0;
function scratchSound(speed) {
  if (!AC) return;
  const t = performance.now();
  if (t - lastScratch < 45) return;
  lastScratch = t;
  nb(0, 0.09, 'bandpass', rnd(3500, 6500), 2, 0.1 + Math.min(speed, 3) * 0.05, 0.004);
  crackle(2 + Math.floor(Math.random() * 3), 0.08, 0.6);
}

function shatterSound() {
  if (!AC) return;
  ping(0, 140, 0.45, 0.6, 38);
  nb(0, 0.55, 'lowpass', 2500, 0.5, 0.7, 0.002, 500);
  nb(0, 0.35, 'highpass', 2000, 0.6, 0.7, 0.001);
  nb(0, 0.9, 'bandpass', 6000, 0.8, 0.25, 0.01, 3000);
  for (let i = 0; i < 46; i++) {
    const t = Math.pow(Math.random(), 1.5) * 1.4 + 0.03;
    ping(t, rnd(1800, 8800), rnd(0.05, 0.28), rnd(0.02, 0.08));
    nb(t, rnd(0.005, 0.009), 'highpass', rnd(3000, 7000), 1, rnd(0.08, 0.22));
  }
}

function vib(p) {
  try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {}
}

/* ---------- wskazówka ---------- */
let idleTimer = 0;
function armHint() {
  clearTimeout(idleTimer);
  hint.classList.remove('on');
  if (damage === 0 && !shards) {
    idleTimer = setTimeout(() => hint.classList.add('on'), CFG.hintDelay);
  }
}
function hideHint() {
  clearTimeout(idleTimer);
  clearTimeout(summaryTimer);
  summary.classList.remove("on");
  if (trophy) trophy.off = nowS();
  hint.classList.remove('on');
}

/* ---------- akcje użytkownika ---------- */
function addDamage(v, x, y) {
  damage += v;
  if (damage >= CFG.limit && !shatterAt && !shards) {
    shatterAt = nowS() + 0.06;
    shX = x; shY = y;
    kick();
  }
}

function busy() { return !!(shards || shatterAt); }

// rozmiar wgniotu: z powierzchni styku palca (PointerEvent.width/height w px, Android Chrome),
// a gdy przeglądarka jej nie podaje (iOS, mysz), losowo
function crushFor(size) {
  const base = size >= 6 ? Math.max(CFG.crushMin, Math.min(CFG.crushMax, size * 0.8)) : rnd(CFG.crushMin, CFG.crushMax);
  return base * rnd(0.85, 1.2);
}

function tap(x, y, size) {
  if (shards) { pushShards([[x, y]]); return; }
  if (busy()) return;
  hideHint();
  spawnStar(x, y, {
    rays: 7 + Math.floor(Math.random() * 5),
    lenMin: 0.3, lenMax: 0.72, w: 2.0,
    ringStart: [26, 40], flash: true, haze: 90, crush: crushFor(size),
    links: 3, ext: 6
  });
  hitSound(1);
  vib(14);
  addDamage(CFG.tapDamage, x, y);
}

function drag(x0, y0, x1, y1, speed) {
  if (busy()) return;
  hideHint();
  spawnTrail(x0, y0, x1, y1);
  scratchSound(speed);
  addDamage(CFG.trailDamage, x1, y1);
}

// przesunięcie palca po odłamkach: punkty co kilka px wzdłuż ruchu, żeby nie przeskoczyć odłamka
function sweepShards(x0, y0, x1, y1, fv) {
  const l = Math.hypot(x1 - x0, y1 - y0) || 1;
  const pts = [];
  for (let d = 0; d <= l; d += 8) pts.push([x0 + (x1 - x0) * d / l, y0 + (y1 - y0) * d / l]);
  pts.push([x1, y1]);
  pushShards(pts, fv, (x1 - x0) / l, (y1 - y0) / l);
}

function miniStar(x, y) {
  if (busy()) return;
  spawnStar(x, y, {
    rays: 4 + Math.floor(Math.random() * 3),
    lenMin: 0.08, lenMax: 0.2, w: 1.3,
    ringStart: [14, 22], flash: true, haze: 40, crush: 14,
    links: 1, ext: 2
  });
  hitSound(0.5);
  vib(8);
  addDamage(CFG.starDamage, x, y);
}

const ptrs = new Map();

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, {
    x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY,
    step: rnd(32, 58), star: 0, nextStar: rnd(200, 320), t: performance.now(), v: 0
  });
  tap(e.clientX, e.clientY, Math.max(e.width || 0, e.height || 0));
});

cv.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  e.preventDefault();
  const now = performance.now();
  const moved = Math.hypot(e.clientX - p.x, e.clientY - p.y);
  const speed = moved / Math.max(1, now - p.t) * 16 / 10;
  // prędkość palca w px/s (wygładzona) do popychania odłamków
  p.v = p.v * 0.4 + moved / Math.max(4, now - p.t) * 1000 * 0.6;
  if (shards) {
    if (moved > 0.5) sweepShards(p.x, p.y, e.clientX, e.clientY, p.v);
    p.x = e.clientX; p.y = e.clientY; p.t = now;
    p.lx = p.x; p.ly = p.y;
    return;
  }
  p.star += moved;
  p.x = e.clientX; p.y = e.clientY; p.t = now;
  if (Math.hypot(p.x - p.lx, p.y - p.ly) >= p.step) {
    drag(p.lx, p.ly, p.x, p.y, speed);
    p.lx = p.x; p.ly = p.y;
    p.step = rnd(32, 58);
    if (p.star >= p.nextStar) {
      p.star = 0;
      p.nextStar = rnd(200, 320);
      miniStar(p.x, p.y);
    }
  }
});

const endPtr = (e) => { ptrs.delete(e.pointerId); };
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);

let lastWheel = 0;
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  initAudio();
  const t = performance.now();
  if (t - lastWheel < 60) return;
  lastWheel = t;
  const dir = Math.sign(e.deltaY) || 1;
  drag(e.clientX, e.clientY, e.clientX + rnd(-14, 14), e.clientY + dir * rnd(36, 60), 1.2);
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === 'Enter') {
    e.preventDefault();
    initAudio();
    tap(rnd(W * 0.15, W * 0.85), rnd(H * 0.15, H * 0.85));
  }
});

// iOS odblokowuje dźwięk (i zgodę na czujniki ruchu) dopiero po zakończeniu gestu
['pointerup', 'touchend', 'click'].forEach((ev) =>
  window.addEventListener(ev, () => { initAudio(); initTilt(); }, { passive: true }));

['gesturestart', 'gesturechange', 'contextmenu', 'dblclick'].forEach((ev) =>
  document.addEventListener(ev, (e) => e.preventDefault()));

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && AC && AC.state !== 'running') initAudio();
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

resize();
armHint();
})();
</script>
</body>
